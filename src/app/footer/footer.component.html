<div *ngIf="!hidden" class="border-0 border-t border-solid border-slate-200 bg-white text-left font-normal">
  <div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-x-6 gap-y-3 px-6 pb-4 pt-5 max-sm:flex-col max-sm:items-start max-sm:px-4">
    <a routerLink="/" aria-label="GrepoData home" class="whitespace-nowrap text-lg font-extrabold leading-none tracking-tight no-underline hover:no-underline focus:no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"><span class="text-navy-800">GREPO</span><span class="text-brand-500">DATA</span></a>
    <nav aria-label="Footer" class="flex flex-wrap items-center gap-x-5 gap-y-2">
      <button type="button" aria-haspopup="dialog" (click)="showDisclaimerDialog()" class="border-0 bg-transparent p-0 text-sm font-medium leading-5 text-slate-600 no-underline hover:text-slate-900 hover:underline focus:text-slate-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">Disclaimer</button>
      <a routerLink="/privacy" class="border-0 bg-transparent p-0 text-sm font-medium leading-5 text-slate-600 no-underline hover:text-slate-900 hover:underline focus:text-slate-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">Privacy</a>
      <a routerLink="/analytics" class="border-0 bg-transparent p-0 text-sm font-medium leading-5 text-slate-600 no-underline hover:text-slate-900 hover:underline focus:text-slate-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">Statistics</a>
    </nav>
  </div>
  <div class="border-0 border-t border-solid border-slate-100">
    <div class="mx-auto flex max-w-[1600px] flex-wrap items-start justify-between gap-x-6 gap-y-2 px-6 pb-5 pt-3.5 text-xs text-slate-500 max-sm:px-4">
      <p class="m-0">
        <ng-container *ngIf="!simplified">Grepolis is a browser game by InnoGames GmbH. This is an unofficial 3rd party site.<br/></ng-container>
        <ng-container *ngIf="!simplified || copyright">Gameplay images related to Grepolis are copyright of InnoGames GmbH.</ng-container>
      </p>
      <p class="m-0 whitespace-nowrap">Copyright &copy; GrepoData {{date | date:'yyyy'}}</p>
    </div>
  </div>
</div>
