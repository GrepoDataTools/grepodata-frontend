<div class="grid grid-cols-[120px_minmax(0,1fr)] gap-6 px-5 text-left font-normal max-sm:grid-cols-1 max-sm:gap-1 max-sm:px-4" [ngClass]="collapsable && details_hidden ? 'py-3.5' : 'py-5'">
  <time class="whitespace-nowrap pt-1 text-sm font-medium tabular-nums text-slate-500">{{dateLabel}}</time>
  <div class="min-w-0">
    <div (click)="details_hidden=!details_hidden" class="flex min-h-7 items-center gap-2.5" [ngClass]="{'cursor-pointer': collapsable}">
      <h3 class="m-0 text-base font-semibold text-slate-900">{{heading}}</h3>
      <span *ngIf="new" class="flex-none rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-600/25">New</span>
      <button *ngIf="collapsable" type="button" [attr.aria-expanded]="!details_hidden" class="ml-auto inline-flex flex-none items-center gap-1.5 whitespace-nowrap rounded-md border-0 bg-white px-2.5 py-1.5 text-xs font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
        {{details_hidden?'More':'Less'}} info
        <svg [appIcon]="details_hidden ? 'chevron-down' : 'chevron-up'" variant="micro" class="size-3.5 flex-none text-slate-400"></svg>
      </button>
    </div>
    <div *ngIf="!collapsable || !details_hidden" class="mt-2 text-sm leading-[22px] text-slate-600 [&_p]:m-0 [&_ul]:m-0 [&_ul]:pl-[18px]">
      <ng-content></ng-content>
      <div *ngIf="github_url" class="mt-3">
        <a href="{{github_url}}" target="_blank" class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-700 hover:text-brand-800 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
          <svg appIcon="github" variant="game" class="size-4 flex-none"></svg>
          View detailed changes on GitHub
          <svg appIcon="arrow-top-right-on-square" variant="micro" class="size-3.5 flex-none"></svg>
        </a>
      </div>
    </div>
  </div>
</div>
