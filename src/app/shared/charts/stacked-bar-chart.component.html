<div role="group" [attr.aria-label]="label" class="relative mb-6 ml-11 mt-6 h-44">
  <span *ngFor="let tick of yTicks; let first = first" aria-hidden="true" class="absolute inset-x-0 border-0 border-t border-solid" [ngClass]="first ? 'border-slate-300' : 'border-slate-100'" [style.top.%]="tick.y"></span>
  <span *ngFor="let tick of yTicks" aria-hidden="true" class="absolute right-full mr-2 -translate-y-1/2 whitespace-nowrap text-[11px] leading-[14px] tabular-nums text-slate-500" [style.top.%]="tick.y">{{tick.value | compactNumber}}</span>

  <div class="absolute inset-0 flex items-end gap-0.5">
    <div *ngFor="let bar of bars; let i = index" class="group relative flex h-full min-w-0 flex-1 flex-col items-center justify-end">
      <span *ngIf="i == peak" aria-hidden="true" class="mb-1 whitespace-nowrap text-[11px] font-semibold leading-[14px] tabular-nums text-slate-700">{{bar.total | compactNumber}}</span>
      <span aria-hidden="true" class="flex w-full max-w-5 flex-col-reverse overflow-hidden rounded-t" [style.height.%]="bar.height" [ngClass]="{'group-hover:opacity-80': clickable}">
        <span *ngFor="let segment of bar.segments; let first = first" class="block w-full flex-none border-0 border-solid border-white" [ngClass]="{'border-b-2': !first && segment.value > 0}" [style.height.%]="segment.share" [style.background-color]="segment.color"></span>
      </span>
      <span aria-hidden="true" class="absolute top-full mt-1.5 text-[11px] leading-[14px] tabular-nums text-slate-500">{{bar.label}}</span>
      <button *ngIf="clickable" type="button" (click)="barSelect.emit(bar.name)" [attr.aria-label]="bar.name + ' · ' + (bar.total | number) + ' points'" class="absolute inset-0 cursor-pointer rounded border-0 bg-transparent p-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700"></button>
      <div role="tooltip" class="pointer-events-none absolute top-0 z-10 w-max min-w-[152px] rounded-lg bg-white px-3 py-2 text-xs shadow-lg ring-1 ring-slate-900/5 [display:none] group-hover:[display:block]" [ngClass]="i < bars.length / 2 ? 'left-full ml-1' : 'right-full mr-1'">
        <p class="mb-1 mt-0 font-semibold text-slate-900">{{bar.name}}</p>
        <div *ngFor="let segment of bar.segments" class="flex items-center gap-2 leading-5">
          <span aria-hidden="true" class="size-2.5 flex-none rounded-[3px]" [style.background-color]="segment.color"></span>
          <span class="min-w-0 flex-1 truncate text-slate-600">{{segment.name}}</span>
          <span class="font-semibold tabular-nums text-slate-900">{{segment.value | number}}</span>
        </div>
      </div>
    </div>
  </div>
</div>
