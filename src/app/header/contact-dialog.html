<div class="flex max-h-[95vh] w-[560px] max-w-full flex-col text-left font-normal text-slate-900 dark:text-white">
  <div class="flex flex-none items-center gap-4 border-0 border-b border-solid border-slate-200 px-6 py-5 max-sm:px-4 dark:border-slate-700">
    <span class="flex size-10 flex-none items-center justify-center rounded-lg bg-navy-800 text-brand-500">
      <svg [appIcon]="custom_title ? 'chat-bubble-left-ellipsis' : 'envelope'" class="size-6"></svg>
    </span>
    <h2 mat-dialog-title class="m-0 min-w-0 flex-1 truncate text-xl font-semibold text-slate-900 dark:text-white">
      <span *ngIf="!custom_title">Contact us</span>
      <span *ngIf="custom_title">{{custom_title}}</span>
    </h2>
    <button type="button" (click)="dialogRef.close()" aria-label="Close" class="-mr-2 inline-flex size-8 flex-none items-center justify-center rounded-md border-0 bg-transparent p-0 text-slate-500 hover:bg-slate-100 hover:text-brand-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 dark:text-slate-400 dark:hover:bg-slate-700">
      <svg appIcon="x-mark" class="size-5"></svg>
    </button>
  </div>

  <div class="flex min-h-0 flex-1 flex-col gap-5 overflow-y-auto px-6 py-5 max-sm:px-4">
    <p *ngIf="context=='cmd_feedback'" class="m-0 flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
      <svg appIcon="bug-ant" class="size-4 flex-none text-slate-400 dark:text-slate-500"></svg>
      <span>If you want to upload an image, please <a routerLink="/profile/bug" class="font-medium text-brand-700 hover:text-brand-800 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">submit a bug report</a> instead.</span>
    </p>

    <app-server-alert></app-server-alert>

    <ng-container *ngIf="submitted==false">
      <div>
        <label for="contact-message" class="mb-1.5 block text-sm font-medium text-slate-900 dark:text-white">Your message</label>
        <textarea id="contact-message" [disabled]="loading" [ngModel]="contact_message" (ngModelChange)="contact_message=$event" required rows="4" class="block w-full resize-y rounded-md border border-solid border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-brand-700 focus:outline-none focus:ring-1 focus:ring-brand-700 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:disabled:bg-slate-700/40"></textarea>
      </div>

      <div>
        <label for="contact-mail" class="mb-1.5 block text-sm font-medium text-slate-900 dark:text-white">Email <span class="font-normal text-slate-500 dark:text-slate-400">(optional)</span></label>
        <input id="contact-mail" autocomplete="email" [disabled]="loading" [ngModel]="contact_mail" (ngModelChange)="contact_mail=$event" placeholder="you@example.com" class="h-10 w-full rounded-md border border-solid border-slate-300 bg-white px-3 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-brand-700 focus:outline-none focus:ring-1 focus:ring-brand-700 disabled:bg-slate-50 disabled:text-slate-400 dark:border-slate-600 dark:bg-slate-800 dark:text-white dark:disabled:bg-slate-700/40">
        <p class="mb-0 mt-1.5 text-xs text-slate-500 dark:text-slate-400">If you want us to reply, please also enter your email address.</p>
      </div>

      <label *ngIf="contact_mail != ''" class="m-0 flex cursor-pointer gap-2.5 text-sm font-normal text-slate-700 dark:text-slate-300">
        <input type="checkbox" class="peer sr-only" [disabled]="loading" [(ngModel)]="privacy_agreed">
        <span aria-hidden="true" class="mt-0.5 flex size-4 flex-none items-center justify-center rounded border border-solid border-slate-300 bg-white text-transparent peer-checked:border-brand-700 peer-checked:bg-brand-700 peer-checked:text-white peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-brand-700 peer-disabled:opacity-60 dark:border-slate-600 dark:bg-slate-800">
          <svg appIcon="check" variant="micro" class="size-3"></svg>
        </span>
        <span>By submitting this form you agree to our <a routerLink="/privacy" (click)="dialogRef.close()" class="font-medium text-brand-700 hover:text-brand-800 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">Privacy Policy</a></span>
      </label>

      <div *ngIf="error!=''" role="alert" class="flex gap-3 rounded-lg bg-rose-50 px-4 py-3 ring-1 ring-inset ring-rose-200 dark:bg-rose-500/10">
        <svg appIcon="exclamation-circle" class="size-5 flex-none text-rose-600 dark:text-rose-400"></svg>
        <div class="min-w-0 text-sm text-rose-700 dark:text-rose-400">
          <p class="m-0 font-semibold">Invalid input</p>
          <p class="mb-0 mt-0.5">{{error}}</p>
        </div>
      </div>
    </ng-container>

    <div *ngIf="submitted==true" class="-order-1 flex flex-col items-center py-3 text-center">
      <span class="flex size-10 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10">
        <svg appIcon="check" class="size-5"></svg>
      </span>
      <h3 class="mb-0 mt-3 text-base font-semibold text-slate-900 dark:text-white">Thanks for reaching out!</h3>
      <p *ngIf="contact_mail!=''" class="mb-0 mt-1 text-sm text-slate-600 dark:text-slate-400">We will respond as soon as possible.</p>
    </div>
  </div>

  <div class="flex flex-none flex-wrap items-center justify-end gap-3 border-0 border-t border-solid border-slate-200 bg-slate-50 px-6 py-4 max-sm:px-4 dark:border-slate-700 dark:bg-slate-700/40">
    <ng-container *ngIf="submitted==false">
      <div class="mr-auto flex min-w-0 items-center gap-1.5 text-[13px] text-slate-500 max-sm:w-full dark:text-slate-400">
        <span class="whitespace-nowrap">Or email</span>
        <button type="button" id="mail" (click)="copy()" class="border-0 bg-transparent p-0 text-[13px] font-medium text-brand-700 hover:text-brand-800 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">admin@grepodata.com</button>
        <button type="button" (click)="copy()" title="Copy address" aria-label="Copy address" class="inline-flex size-7 flex-none items-center justify-center rounded-md border-0 bg-transparent p-0 hover:bg-slate-100 hover:text-brand-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 dark:hover:bg-slate-700" [ngClass]="copied ? 'text-brand-700' : 'text-slate-400'">
          <svg [appIcon]="copied ? 'clipboard-document-check' : 'clipboard-document'" class="size-4"></svg>
        </button>
        <span *ngIf="copied" class="font-medium text-brand-700">Copied</span>
      </div>
      <button type="button" (click)="dialogRef.close()" class="inline-flex items-center justify-center gap-1.5 rounded-md border-0 bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 dark:bg-slate-800 dark:text-white dark:ring-slate-600 dark:hover:bg-slate-700/60">Cancel</button>
      <button type="button" [disabled]="loading" (click)="captchaRef.execute()" class="inline-flex items-center justify-center gap-1.5 whitespace-nowrap rounded-md border-0 bg-brand-700 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 disabled:cursor-progress disabled:opacity-75">
        <svg *ngIf="!loading" appIcon="paper-airplane" variant="mini" class="size-4 flex-none"></svg>
        <span *ngIf="loading" class="size-4 flex-none animate-spin rounded-full border-2 border-solid border-white/35 border-t-white"></span>
        <span *ngIf="loading">Sending message...</span>
        <span *ngIf="!loading">Send message</span>
      </button>
    </ng-container>
    <button *ngIf="submitted==true" type="button" (click)="dialogRef.close()" class="inline-flex items-center justify-center gap-1.5 rounded-md border-0 bg-white px-3 py-2 text-sm font-semibold text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 dark:bg-slate-800 dark:text-white dark:ring-slate-600 dark:hover:bg-slate-700/60">Close</button>
  </div>

  <div *ngIf="submitted==false">
    <re-captcha
            size="invisible"
            #captchaRef="reCaptcha"
            siteKey="{{recaptcha_key}}"
            (resolved)="$event && resolved($event)">
    </re-captcha>
  </div>
</div>
