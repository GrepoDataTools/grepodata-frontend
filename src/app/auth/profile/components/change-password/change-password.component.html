<section class="grid grid-cols-[300px_minmax(0,1fr)] items-start gap-8 text-left font-normal max-lg:grid-cols-1 max-lg:gap-4">
	<div class="flex gap-3">
		<span aria-hidden="true" class="flex size-9 flex-none items-center justify-center rounded-lg bg-brand-50 text-brand-700 dark:bg-brand-500/10">
			<svg appIcon="key" class="size-5"></svg>
		</span>
		<div class="min-w-0">
			<h2 class="m-0 text-base font-semibold text-slate-900 dark:text-white">Change password</h2>
			<p class="mb-0 mt-1 text-sm text-slate-600 dark:text-slate-400">Enter your current password, then choose a new one of at least 8 characters.</p>
		</div>
	</div>

	<div class="overflow-hidden rounded-xl bg-white shadow-sm ring-1 ring-slate-900/[.08] dark:bg-slate-800 dark:ring-white/10">
		<form *ngIf="!success" [formGroup]="passwordForm" (ngSubmit)="environment.production==true?captchaRef.execute():sendRequest()" class="m-0">
			<div class="flex flex-col gap-5 p-5">
				<div *ngIf="error" role="alert" class="flex gap-3 rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700 ring-1 ring-inset ring-rose-200 dark:bg-rose-500/10 dark:text-rose-400">
					<svg appIcon="exclamation-circle" class="size-5 flex-none text-rose-600 dark:text-rose-400"></svg>
					<p class="m-0 min-w-0">{{error}}</p>
				</div>

				<div class="w-full max-w-md">
					<label for="cp-oldpassword" class="mb-1.5 block text-sm font-medium text-slate-900 dark:text-white">Current password</label>
					<div class="relative">
						<input id="cp-oldpassword" autocomplete="off" type="password" formControlName="oldpassword" class="h-9 w-full rounded-md border border-solid border-slate-300 bg-white px-2.5 text-sm text-slate-900 shadow-sm focus:border-brand-700 focus:outline-none focus:ring-1 focus:ring-brand-700 dark:border-slate-600 dark:bg-slate-800 dark:text-white" [ngClass]="{ '!border-rose-400 pr-9 focus:!border-rose-500 focus:!ring-rose-500': submitted && f.oldpassword.errors }" />
						<svg *ngIf="submitted && f.oldpassword.errors" appIcon="exclamation-circle" class="pointer-events-none absolute right-2.5 top-2.5 size-4 text-rose-500"></svg>
					</div>
					<div *ngIf="submitted && f.oldpassword.errors" class="mt-1.5 text-xs text-rose-600 dark:text-rose-400">
						<div *ngIf="f.oldpassword.errors.required">Password is required</div>
					</div>
				</div>

				<div class="w-full max-w-md">
					<label for="cp-password" class="mb-1.5 block text-sm font-medium text-slate-900 dark:text-white">New password</label>
					<div class="relative">
						<input id="cp-password" autocomplete="off" type="password" formControlName="password" class="h-9 w-full rounded-md border border-solid border-slate-300 bg-white px-2.5 text-sm text-slate-900 shadow-sm focus:border-brand-700 focus:outline-none focus:ring-1 focus:ring-brand-700 dark:border-slate-600 dark:bg-slate-800 dark:text-white" [ngClass]="{ '!border-rose-400 pr-9 focus:!border-rose-500 focus:!ring-rose-500': submitted && f.password.errors }" />
						<svg *ngIf="submitted && f.password.errors" appIcon="exclamation-circle" class="pointer-events-none absolute right-2.5 top-2.5 size-4 text-rose-500"></svg>
					</div>
					<div *ngIf="submitted && f.password.errors" class="mt-1.5 text-xs text-rose-600 dark:text-rose-400">
						<div *ngIf="f.password.errors.required">Password is required</div>
					</div>
					<p class="mb-0 mt-1.5 text-xs text-slate-500 dark:text-slate-400">At least 8 characters</p>
				</div>

				<div class="w-full max-w-md">
					<label for="cp-password2" class="mb-1.5 block text-sm font-medium text-slate-900 dark:text-white">Confirm new password</label>
					<div class="relative">
						<input id="cp-password2" autocomplete="off" type="password" formControlName="password2" class="h-9 w-full rounded-md border border-solid border-slate-300 bg-white px-2.5 text-sm text-slate-900 shadow-sm focus:border-brand-700 focus:outline-none focus:ring-1 focus:ring-brand-700 dark:border-slate-600 dark:bg-slate-800 dark:text-white" [ngClass]="{ '!border-rose-400 pr-9 focus:!border-rose-500 focus:!ring-rose-500': submitted && f.password2.errors }" />
						<svg *ngIf="submitted && f.password2.errors" appIcon="exclamation-circle" class="pointer-events-none absolute right-2.5 top-2.5 size-4 text-rose-500"></svg>
					</div>
					<div *ngIf="submitted && f.password2.errors" class="mt-1.5 text-xs text-rose-600 dark:text-rose-400">
						<div *ngIf="f.password2.errors.required">Password verification is required</div>
					</div>
				</div>

				<mat-progress-bar *ngIf="loading" mode="indeterminate" class="max-w-md rounded-full"></mat-progress-bar>
			</div>

			<div class="flex items-center justify-end gap-3 border-0 border-t border-solid border-slate-200 bg-slate-50 px-5 py-3 dark:border-slate-700 dark:bg-slate-700/40">
				<button type="submit" [disabled]="loading" class="inline-flex items-center justify-center gap-1.5 rounded-md border-0 bg-brand-700 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700 disabled:cursor-progress disabled:opacity-60">
					<span *ngIf="loading" class="size-4 flex-none animate-spin rounded-full border-2 border-solid border-white/35 border-t-white"></span>
					Change password
				</button>
			</div>
		</form>

		<div *ngIf="success" class="p-5">
			<div role="status" class="flex gap-3 rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-700 ring-1 ring-inset ring-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400">
				<svg appIcon="check-circle" class="size-5 flex-none text-emerald-600"></svg>
				<div class="min-w-0">
					<p class="m-0 font-semibold">Password changed successfully</p>
					<p class="mb-0 mt-0.5">Your password has been updated.</p>
				</div>
			</div>
		</div>
	</div>
</section>

<re-captcha
  size="invisible"
  #captchaRef="reCaptcha"
  siteKey="{{recaptcha_key}}"
  (resolved)="$event && resolved_captcha($event)">
</re-captcha>
