<mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
<!--  <div *ngIf="error">{{error}}</div>-->
<section *ngIf="!error && !loading && (events.length > 1 || event_type == 'user')" class="overflow-hidden rounded-xl bg-white text-left font-normal shadow-sm ring-1 ring-slate-900/[.08] dark:bg-slate-800 dark:ring-white/10">
  <div class="flex min-h-[61px] flex-wrap items-center justify-between gap-x-3 border-0 border-b border-solid border-slate-200 px-5 py-2 dark:border-slate-700">
    <h3 *ngIf="event_type=='team'" class="m-0 text-base font-medium text-slate-900 dark:text-white">Team Events</h3>
    <h3 *ngIf="event_type=='user'" class="m-0 text-base font-medium text-slate-900 dark:text-white">Your GrepoData Team Events</h3>

    <mat-paginator *ngIf="total_events > size"
                   [length]="total_events"
                   [pageSize]="size"
                   [hidePageSize]="true"
                   [pageIndex]="from/size"
                   (page)="paginatorEvent($event)"
                   [disabled]="paging">
    </mat-paginator>
  </div>

  <div class="relative">
    <div *ngIf="paging" class="absolute inset-0 z-10 flex items-center justify-center">
      <mat-spinner [diameter]="50"></mat-spinner>
    </div>

    <div class="pl-5 [container-type:inline-size]" [ngClass]="{'opacity-40': paging}">
      <div *ngFor="let event of events" class="grid grid-cols-[96px_minmax(0,1fr)] items-start gap-x-4 gap-y-1 border-0 border-b border-solid border-slate-100 py-3 pr-5 text-sm last:border-b-0 [@container(min-width:600px)]:flex [@container(min-width:600px)]:gap-4 dark:border-slate-700">
        <div class="w-24 flex-none tabular-nums">
          <div class="text-slate-700 dark:text-slate-300">{{event.local_time | Datex : 'D MMM YYYY'}}</div>
          <div class="text-xs text-slate-500 dark:text-slate-400">{{event.local_time | Datex : 'HH:mm'}}</div>
        </div>
        <div class="min-w-0 flex-1 text-slate-600 dark:text-slate-400">
          <ng-container *ngFor="let part of event['json'];">
            <span *ngIf="part.type == 'text'">{{part.text}}</span>
            <span *ngIf="part.type == 'bold'"><strong class="font-medium text-slate-900 dark:text-white">{{part.text}}</strong></span>
            <span *ngIf="part.type == 'user'" class="font-medium text-brand-700"><svg appIcon="user" class="inline-block size-4 align-middle"></svg> {{part.text}}</span>
            <span *ngIf="part.type == 'alliance'" class="font-medium text-brand-700"><svg appIcon="ally_ico" variant="game" class="inline-block size-4 align-middle"></svg> {{part.text}}</span>
            <span *ngIf="part.type == 'player'" class="font-medium text-brand-700"><svg appIcon="player_ico" variant="game" class="inline-block size-4 align-middle"></svg> {{part.text}}</span>
            <span *ngIf="part.type == 'town'" class="font-medium text-brand-700"><svg appIcon="town_ico" variant="game" class="inline-block size-4 align-middle"></svg> {{part.text}}</span>
            <span *ngIf="part.type == 'team'" class="font-medium text-brand-700"><svg appIcon="user-group" class="inline-block size-4 align-middle"></svg> {{part.text}}</span>
          </ng-container>
        </div>
        <div *ngIf="event_type=='user'" class="col-start-2 flex-none">
          <button type="button" routerLink="/profile/team/{{event.index_key}}" class="inline-flex items-center gap-1 border-0 bg-transparent p-0 text-sm font-medium text-brand-700 hover:text-brand-800 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-700">
            Team: {{event.index_key | IndexNamePipe}}
            <svg appIcon="arrow-top-right-on-square" class="size-4 flex-none"></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
